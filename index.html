<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->
  <meta name="description" content="Frontend Mentor | Social links profile">

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  
  <title>Frontend Mentor | Social links profile</title>

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="wrapperContainer">
    <div class="container">
      <header class="header">
        <img class="header__photo" src="./assets/images/avatar-jessica.jpeg" alt="Jessica Randall">
        <div class="header__mainContent">
          <h1 class="header__name">Jessica Randal</h1>
          <address class="header__endress">London, United Kingdom</address>
        </div>
        <p class="header__bio">"Front-end developer and avid reader."</p>
      </header>
      <main>
        <nav>
          <ul>
            <li class="listItem"><a class="listItem__link" href="https://github.com/" target="_blank" rel="noopener noreferrer">GitHub</a></li>
            <li class="listItem"><a class="listItem__link" href="https://frontendmentor.io/" target="_blank" rel="noopener noreferrer">Frontend Mentor</a></li>
            <li class="listItem"><a class="listItem__link" href="https://linkedin.com" target="_blank" rel="noopener noreferrer">LinkedIn</a></li>
            <li class="listItem"><a class="listItem__link" href="https://x.com/" target="_blank" rel="noopener noreferrer">X (formerly Twitter)</a></li>
            <li class="listItem"><a class="listItem__link" href="https://instagram.com/" target="_blank" rel="noopener noreferrer">Instagram</a></li>
          </ul>
        </nav>
      </main>
    </div>
  </div>
  
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank" rel="noopener noreferrer">Frontend Mentor</a>. 
    Coded by <a href="https://www.frontendmentor.io/profile/dords-32" target="_blank" rel="noopener noreferrer">Dords</a>.
  </footer>
</body>
</html>
